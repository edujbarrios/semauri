name: Jupyter kernel integration
on:
  pull_request:
    paths:
      - "integrations/jupyter/**"
      - ".github/workflows/jupyter.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "integrations/jupyter/**"
      - ".github/workflows/jupyter.yml"
permissions:
  contents: read
jobs:
  jupyter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ./integrations/jupyter
      - run: python -m unittest discover -s integrations/jupyter/tests -v
      - run: cargo build
      - run: semauri-jupyter-install --sys-prefix
      - name: Real notebook messaging smoke test
        run: SEMAURI_BINARY="$(pwd)/target/debug/semauri" python -m unittest discover -s integrations/jupyter/protocol_tests -v
