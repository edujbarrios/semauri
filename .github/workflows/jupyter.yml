name: Jupyter kernel integration (Rust)
on:
  pull_request:
    paths:
      - "integrations/jupyter/**"
      - "src/compiler/**"
      - ".github/workflows/jupyter.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "integrations/jupyter/**"
      - ".github/workflows/jupyter.yml"
permissions:
  contents: read
jobs:
  jupyter:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ZeroMQ development library
        run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y libzmq3-dev pkg-config
      - name: Build Semauri compiler
        run: cargo build --locked
      - name: Test native Rust kernel
        run: cargo test --manifest-path integrations/jupyter/Cargo.toml
      - name: Verify kernel installation
        run: |
          cargo build --manifest-path integrations/jupyter/Cargo.toml
          integrations/jupyter/target/debug/semauri-jupyter install --prefix=/tmp/semauri-test-prefix
          test -f /tmp/semauri-test-prefix/share/jupyter/kernels/semauri/kernel.json
