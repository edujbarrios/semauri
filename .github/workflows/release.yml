name: Release Semauri Distribution

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Resolve Semauri version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - id: release
        name: Check whether the release already exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1 && [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already published; nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  package-unix:
    name: package (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Semauri
        run: cargo build --release
      - name: Package and smoke-test Semauri
        shell: bash
        env:
          SEMAURI_PLATFORM: ${{ matrix.platform }}
          SEMAURI_BINARY: ${{ github.workspace }}/target/release/semauri
        run: ./scripts/release/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: semauri-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  package-windows:
    name: package (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x86_64
          - runner: windows-11-arm
            platform: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Semauri
        run: cargo build --release
      - name: Package and smoke-test Semauri
        shell: pwsh
        run: ./scripts/release/package.ps1 -BinaryPath 'target\release\semauri.exe' -SemauriPlatform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: semauri-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: [prepare, package-unix, package-windows]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -type f \( -name 'semauri-*.tar.gz' -o -name 'semauri-*.zip' \) -exec cp {} release/ \;
          test "$(find release -type f -name 'semauri-*.tar.gz' | wc -l)" -eq 4
          test "$(find release -type f -name 'semauri-*.zip' | wc -l)" -eq 2
          (cd release && sha256sum semauri-* > SHA256SUMS)
          cat release/SHA256SUMS
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Semauri $VERSION"
          fi
