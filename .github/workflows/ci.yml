name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Syntax check
        run: |
          find lib test -name '*.rb' -print0 | xargs -0 -n1 ruby -c
          ruby -c bin/semauri
      - name: Distribution shell syntax
        run: |
          sh -n install.sh distribution/bin/semauri
          bash -n scripts/package-distribution.sh
      - name: Tests
        run: ruby -Ilib -e 'Dir["test/test_*.rb"].sort.each { |file| require_relative file }'

  windows-distribution-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = @('install.ps1', 'scripts/package-distribution.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file`: $($_.Message)" }
              exit 1
            }
          }
