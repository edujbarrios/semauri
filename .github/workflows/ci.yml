name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Test Rust compiler
        run: cargo test --all-targets --locked

  distribution-unix:
    name: distribution (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native binary
        run: cargo build --release --locked
      - name: Package and smoke-test
        shell: bash
        env:
          SEMAURI_PLATFORM: ${{ matrix.platform }}
          SEMAURI_BINARY: ${{ github.workspace }}/target/release/semauri
        run: |
          set -euo pipefail
          bash -n scripts/release/package.sh install.sh
          ./scripts/release/package.sh
          test -n "$(find dist -type f -name 'semauri-*.tar.gz' -print -quit)"

  distribution-windows:
    name: distribution (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x86_64
          - runner: windows-11-arm
            platform: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = @('install.ps1', 'scripts/release/package.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file\: $($_.Message)" }
              exit 1
            }
          }
      - name: Build native binary
        run: cargo build --release --locked
      - name: Package and smoke-test
        shell: pwsh
        run: |
          ./scripts/release/package.ps1 -BinaryPath 'target\release\semauri.exe' -SemauriPlatform '${{ matrix.platform }}'
          if (-not (Get-ChildItem 'dist' -Filter 'semauri-*.zip' -File)) {
            throw 'Windows distribution archive was not produced'
          }
