[package]
name = "semauri-jupyter"
version = "0.11.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "Native Rust Jupyter kernel transport for Semauri"
publish = false

# Separate crate: core Semauri builds do not depend on ZeroMQ or Jupyter.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zmq = "0.10"
hmac = "0.12"
sha2 = "0.10"
chrono = "0.4"
