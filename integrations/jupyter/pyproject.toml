[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semauri-jupyter"
version = "0.1.0"
description = "Official Jupyter kernel adapter for Semauri"
requires-python = ">=3.9"
dependencies = ["ipykernel>=6,<8"]

[project.scripts]
semauri-jupyter-install = "semauri_kernel.install:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semauri_kernel*"]
